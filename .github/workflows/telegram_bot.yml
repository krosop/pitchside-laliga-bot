name: Pitchside 24/7 Telegram Bot Runner

on:
  schedule:
    # Re-launches every 5 hours so the bot runs continuously 24/7 on GitHub Actions
    - cron: "0 */5 * * *"
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Ensures only 1 bot poller runs at a time (prevents Telegram 409 Conflict)
concurrency:
  group: pitchside-telegram-bot-poller
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  run-telegram-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Interactive Telegram Bot (5.5h Cloud Cycle with Daily Auto-Sync)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py --bot --max-runtime 19500

      - name: Persist Subscriber List & Updated Data to Repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laliga_profiles.db || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): persist subscribers & daily match state [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi
