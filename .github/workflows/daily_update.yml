name: Daily La Liga Sync & Matches Digest

on:
  schedule:
    # Runs every day at 07:30 UTC (and 18:00 UTC for evening match updates)
    - cron: "30 7 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-sync-and-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Daily La Liga Fixtures, Standings, Elo & Broadcast Today's Matches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run.py --daily-digest

      - name: Commit and Push Updated Database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laliga_profiles.db || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): daily La Liga matches & standings sync [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
